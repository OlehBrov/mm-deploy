services:

  backend:
    build:
      context: ../mm-back-nest
    ports:
      - "6006:6006"       # HTTP + WebSocket — доступно з LAN для адмін-панелі / Postman
    environment:
      # ── База даних ────────────────────────────────────────────────────────────
      # integratedSecurity НЕ працює з Docker → потрібна SQL Server аутентифікація
      DATABASE_URL: "sqlserver://host.docker.internal:1433;database=original;user=mm_user;password=mmNextRetail_TS-2026;trustServerCertificate=true"

      # ── JWT ───────────────────────────────────────────────────────────────────
      AUTH_TOKEN_SECRET_KEY: "uH6TO6sqzIewxb71xs8"
      REFRESH_TOKEN_SECRET_KEY: "W}mUE6{(]R+n+gLw(KwW"

      # ── Термінал ─────────────────────────────────────────────────────────────
      TERMINAL_PROVIDER: privatbank
      CLIENT_HOST: 10.100.5.19   # IP терміналу в WiFi мережі (рекомендується статичний IP)
      PRIVATBANK_PORT: "2000"
      MONOBANK_PORT: "3000"
      # Ingenico SELF2000 (BPOS1, active_bank = ingenico). IP береться з TerminalConfig в БД.
      INGENICO_PORT: "2000"
      INGENICO_MERCH_IDX: "1"
      INGENICO_HEARTBEAT_MS: "8000"   # 0 = вимкнути heartbeat (ExchangeStatuses)
      TERMINAL_PAYMENT_TIMEOUT_MS: "60000"
      TERMINAL_CONNECTION_TIMEOUT_MS: "15000"
      TERMINAL_RECONNECT_INTERVAL_MS: "30000"

      # ── Фіскалізація ─────────────────────────────────────────────────────────
      FISCAL_HOST: "https://kasa.vchasno.ua"
      # AUTH_MERCH_TOKEN: "q8FYOPDaDMDiSD8_S5kElkut54Wl2P7SL4SZ9RP_Ibs2Fai6GhRmDgBeg_ICgIAv"
      AUTH_MERCH_TOKEN: "kQJSRfPrhTJfAsLw8UtTAK9w7CwzE5QOAKIulXGWgN9PtdEEo_5b0n0PeEi3nQ4v"
      AUTH_MERCH_TOKEN_VAT: "5dq5ej0FzBUdJc5_bxAviizD8TfNGlji_dwWxDWb6vr9pDKGeCHUB3Su_rOdonDH"
      FISCAL_RETRY_INTERVAL_MS: "10000"

      # ── Зображення ───────────────────────────────────────────────────────────
      IMAGE_DIR: /app/images
      CATEGORY_IMAGE_DIR: /app/images/cat-images

      # ── Магазин ──────────────────────────────────────────────────────────────
      PORT: "6006"
      MM_HOST: "http://backend:6006"
      STORE_ID: "11"
      STORE_AUTH_ID: "998877"

      # ── Email-1: відправник + отримувач сповіщень (чеки, черга, excel) ────────
      MAIL_HOST: "smtp.ukr.net"
      MAIL_PORT: "465"
      MAIL_SECURE: "true"
      MAIL_USER: "cf-role1@ukr.net"
      MAIL_PASS: "3aVB'-*KNq.IUY/@"
      MAIL_FROM: "MicroMarket <cf-role1@ukr.net>"
      MAIL_TO: "cf-role1@ukr.net"
      # Email-2: отримувач повідомлень від покупців при проблемах (інтерфейс ще не реалізовано)
      MAIL_SUPPORT_TO: "cf-role2@ukr.net"
      MAIL_SUPPORT_USER: "cf-role2@ukr.net"
      MAIL_SUPPORT_PASS: "6xFCPBR||la6V4hm"

    volumes:
      - C:/git/mm-images:/app/images   # bind mount — картинки зберігаються на диску хоста

    extra_hosts:
      - "host.docker.internal:host-gateway"   # доступ до MS SQL на хості (потрібно на Linux; на Windows Docker Desktop вбудовано)

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    restart: unless-stopped

  frontend:
    build:
      context: ../mm-front-ts
      args:
        VITE_STORE_LOGIN: "998877"
        VITE_STORE_PASSWORD: "mm_nextretail"
        # Сканування цього штрихкоду відкриває екран конфігу (/setup), після чого
        # все одно запитується пароль (ServiceUsers.password) через SetupAuthGate.
        # 14 цифр — свідомо не збігається з довжиною реальних товарних EAN-13 (13 цифр).
        VITE_CONFIG_BARCODE: "09090909090909"
    ports:
      - "80:80"           # кіоск-браузер відкриває http://localhost
    depends_on:
      - backend

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    restart: unless-stopped

